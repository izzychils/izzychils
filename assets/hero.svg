<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 380" width="1160" height="380" role="img" aria-label="Israel Iraoya, Full Stack Software Engineer">
  <title>Israel Iraoya, Full Stack Software Engineer</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0D0A1A"/>
    </linearGradient>

    <radialGradient id="pinkHalo">
      <stop offset="0" stop-color="#FF2D87" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FF2D87" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF2D87" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanHalo">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF2D87"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <text id="nameText" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1">Israel Iraoya</text>

    <mask id="nameMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1160" height="380">
      <use xlink:href="#nameText" href="#nameText" x="64" y="156" fill="#FFFFFF"/>
    </mask>

    <clipPath id="reveal">
      <rect x="64" y="248" width="0" height="42">
        <animate attributeName="width" values="0;630;630;0" keyTimes="0;0.32;0.94;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g>
    <!-- backdrop -->
    <rect width="1160" height="380" rx="22" fill="url(#bgGrad)"/>
    <rect width="1160" height="380" rx="22" fill="url(#grid)"/>

    <!-- breathing light pools -->
    <circle cx="150" cy="30" r="300" fill="url(#pinkHalo)">
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="370" r="320" fill="url(#cyanHalo)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- neon frame -->
    <rect x="0.75" y="0.75" width="1158.5" height="378.5" rx="22" fill="none" stroke="url(#nameGrad)" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- name: glow, then gradient fill with a light sweeping across it -->
    <g filter="url(#softGlow)" opacity="0.5">
      <use xlink:href="#nameText" href="#nameText" x="64" y="156" fill="#FF2D87"/>
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="5s" repeatCount="indefinite"/>
    </g>

    <g mask="url(#nameMask)">
      <rect width="1160" height="380" fill="url(#nameGrad)"/>
      <rect x="-260" y="60" width="220" height="150" fill="url(#sweepGrad)" opacity="0.75">
        <animate attributeName="x" values="-260;1240" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- animated underline -->
    <rect x="64" y="182" width="0" height="3" rx="1.5" fill="url(#nameGrad)">
      <animate attributeName="width" values="0;250" dur="1.8s" begin="0.3s" fill="freeze"/>
    </rect>

    <!-- rotating role -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#E6EDF3">
      <text x="64" y="230" opacity="1">Full-Stack Engineer
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.304;0.333;0.971;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="230" opacity="0">React &amp; Node Developer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.35;0.637;0.667;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="230" opacity="0">Product-Minded Builder
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.683;0.971;0.99;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- typing line -->
    <g clip-path="url(#reveal)">
      <text x="64" y="278" font-family="'Cascadia Code', 'Courier New', monospace" font-size="19" fill="#7DD3FC">&gt; building fast interfaces + the APIs &amp; SQL behind them</text>
    </g>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.52;0.54" dur="1s" repeatCount="indefinite"/>
      <rect x="64" y="261" width="2.5" height="21" fill="#FF2D87">
        <animate attributeName="x" values="64;694;694;64" keyTimes="0;0.32;0.94;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.31;0.32;0.96;0.97;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- status chips -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="64" y="312" width="200" height="32" rx="16" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.5"/>
      <circle cx="84" cy="328" r="4" fill="#34D399">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="333" fill="#BAE6FD">Open to full-stack roles</text>

      <rect x="280" y="312" width="238" height="32" rx="16" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.5"/>
      <text x="300" y="333" fill="#DDD6FE">TypeScript · React · Node · SQL</text>

      <rect x="534" y="312" width="150" height="32" rx="16" fill="#0F172A" stroke="#FF2D87" stroke-opacity="0.5"/>
      <text x="554" y="333" fill="#FBCFE8">Remote-friendly</text>
    </g>
  </g>
</svg>
